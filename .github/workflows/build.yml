name: Build Windows Exe

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 讀取專案程式碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: 安裝必要套件與 PyTorch (CPU版本)
      run: |
        python -m pip install --upgrade pip
        python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
        python -m pip install faster-whisper ttkbootstrap pyinstaller

    - name: 開始使用 PyInstaller 打包 .exe
      run: |
        python -m PyInstaller --noconsole --onefile --name="WhisperVistitleTranslator" whisperX_v2.py

    - name: 上傳打包好的 .exe 檔案供下載
      uses: actions/upload-artifact@v4
      with:
        name: WhisperVistitleTranslator-Exe
        path: dist/WhisperVistitleTranslator.exe
